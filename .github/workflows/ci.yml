name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DUNE_PROFILE: release
  OCAMLRUNPARAM: b
  PINS: |
    odoc-parser https://github.com/davesnx/odoc.git#markdown-types
    odoc https://github.com/davesnx/odoc.git#markdown-types

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - 5.3.0

    steps:
      - uses: actions/checkout@v4

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.2.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          pins: ${{ env.PINS }}
          with-doc: true
          with-dev-setup: true

      - name: Load dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.2.0

      - name: Build
        run: make build

      - name: Check formatting
        run: make format-check

      - name: Run tests
        run: make test

      - name: Run benchmarks
        run: make bench

      - name: Save dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.2.0

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.2.0
        with:
          ocaml-compiler: 5.3.0
          pins: ${{ env.PINS }}
          with-doc: true
          with-dev-setup: true

      - name: Generate documentation markdown
        run: make docs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build website for every version
        run: make website-build-versions

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release to opam
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.2.0
        with:
          ocaml-compiler: 5.3.0
          pins: ${{ env.PINS }}
          with-doc: true
          with-dev-setup: true
          extra-packages: dune-release

      - name: Release
        uses: davesnx/dune-release-action@v0.4.0
        with:
          packages: 'parseff'
          changelog: './CHANGES.md'
          github-token: ${{ secrets.GH_TOKEN }}
